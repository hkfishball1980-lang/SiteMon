<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B3A4B">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="地盤巡查">
  <meta name="description" content="Offline iPad Estate Structural Inspection PWA (Project -> Elements -> HD Appendix X Report).">
  <title>地盤巡查 Site Inspection v3.6</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-icon" src="./icons/icon-192.png" width="36" height="36" alt="">
        <div>
          <h1><span id="appTitle">地盤巡查</span> <span class="ver-pill">v3.6</span></h1>
          <p class="tagline" id="appTagline">屋邨專案 → 多項 Structural Elements → Appendix X 巡查報告</p>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" id="btnLayoutMode" class="layout-badge" title="Switch iPad / Phone layout">Auto</button>
        <span id="connBadge" class="badge badge-net" hidden></span>
        <button type="button" id="btnLang" class="btn btn-ghost btn-sm" aria-label="Switch language">EN</button>
      </div>
    </header>

    <div id="modeBanner" class="banner" hidden></div>

    <nav class="tabs" role="tablist" aria-label="Main">
      <button type="button" class="tab is-active" data-tab="projects" role="tab" aria-selected="true" id="tab-projects"></button>
      <button type="button" class="tab" data-tab="projectDetail" role="tab" aria-selected="false" id="tab-projectDetail" hidden></button>
      <button type="button" class="tab" data-tab="element" role="tab" aria-selected="false" id="tab-element" hidden></button>
      <button type="button" class="tab" data-tab="album" role="tab" aria-selected="false" id="tab-album"></button>
      <button type="button" class="tab" data-tab="map" role="tab" aria-selected="false" id="tab-map"></button>
      <button type="button" class="tab" data-tab="export" role="tab" aria-selected="false" id="tab-export"></button>
    </nav>

    <main>
      <!-- VIEW 1: PROJECTS LIST (ONE ESTATE PER PROJECT) -->
      <section id="view-projects" class="view is-active" role="tabpanel">
        <div class="toolbar">
          <label class="search-wrap">
            <span class="sr-only" id="lblSearchProj">搜尋屋邨專案</span>
            <input type="search" id="searchProjInput" autocomplete="off">
          </label>
          <button type="button" id="btnNewProject" class="btn btn-primary"></button>
        </div>
                <div class="rmo-bar" id="rmoFilterBar">
          <button type="button" class="rmo-chip is-active" data-rmo="all" id="rmoAll">全部 RMO</button>
          <button type="button" class="rmo-chip" data-rmo="HKI">HKI</button>
          <button type="button" class="rmo-chip" data-rmo="KC">KC</button>
          <button type="button" class="rmo-chip" data-rmo="KE">KE</button>
          <button type="button" class="rmo-chip" data-rmo="KWS">KWS</button>
          <button type="button" class="rmo-chip" data-rmo="TY">TY</button>
          <button type="button" class="rmo-chip" data-rmo="TNS">TNS</button>
          <button type="button" class="rmo-chip" data-rmo="WTT">WTT</button>
        </div>
        <p id="projectsEmpty" class="empty" hidden></p>
        <div id="projectsList" class="card-list"></div>
      </section>

      <!-- VIEW 2: PROJECT DETAIL (ELEMENTS LIST INSIDE ONE ESTATE) -->
      <section id="view-projectDetail" class="view" role="tabpanel" hidden>
        <div class="breadcrumb">
          <button type="button" id="btnBackToProjects" class="btn btn-ghost btn-sm"></button>
          <span id="crumbProjectName"></span>
        </div>

        <div class="project-hero">
          <div class="project-hero-top">
            <div>
              <h2 id="heroEstateTitle"></h2>
              <p class="meta" id="heroEstateMeta"></p>
            </div>
            <button type="button" id="btnEditProject" class="btn btn-ghost btn-sm"></button>
          </div>
          <div class="project-hero-actions">
            <button type="button" id="btnAddElement" class="btn btn-primary btn-sm"></button>
            <button type="button" id="btnAddFormB" class="btn btn-navy btn-sm"></button>
            <button type="button" id="btnProjectReport" class="btn btn-secondary btn-sm"></button>
            <button type="button" id="btnProjectZip" class="btn btn-ghost btn-sm"></button>
            <button type="button" id="btnDeleteProject" class="btn btn-ghost btn-sm"></button>
          </div>
        </div>

        <div class="toolbar">
          <label class="search-wrap">
            <span class="sr-only" id="lblSearchElem">搜尋構建物</span>
            <input type="search" id="searchElemInput" autocomplete="off">
          </label>
        </div>
        <div class="filter-bar" id="statusFilterBar">
          <button type="button" class="chip is-active" data-filter="all" id="fltAll"></button>
          <button type="button" class="chip" data-filter="sse" id="fltSse"></button>
          <button type="button" class="chip" data-filter="followup" id="fltFollowup"></button>
          <button type="button" class="chip" data-filter="normal" id="fltNormal"></button>
        </div>
        <p id="elementsEmpty" class="empty" hidden></p>
        <div id="elementsList" class="card-list"></div>
      </section>

      <!-- VIEW 3: STRUCTURAL ELEMENT INSPECTION FORM -->
      <section id="view-element" class="view" role="tabpanel" hidden>
        <div class="breadcrumb">
          <button type="button" id="btnBackToProject" class="btn btn-ghost btn-sm"></button>
          <strong id="crumbElemContext"></strong>
        </div>

        <form id="elementForm" autocomplete="off">
          <input type="hidden" id="fieldElemId">
          <div class="form-type-switch" id="formTypeSwitch" role="tablist" aria-label="Inspection Form Type">
            <button type="button" class="form-type-btn is-active" data-form="A" id="btnFormTypeA">Form A · Appendix X</button>
            <button type="button" class="form-type-btn" data-form="B" id="btnFormTypeB">Form B · Annual Inspection</button>
          </div>

          <div class="panel">
            <div class="panel-head">
              <h2 id="secElemHeader"></h2>
              <button type="button" id="btnElemReport" class="btn btn-secondary btn-sm" hidden></button>
            </div>
            <div class="form-grid">
              <label class="field">
                <span id="lblElemName"></span>
                <select id="fieldElemSelect" required>
                  <option value="" id="optElemPlaceholder">-- Select External Work / Structure --</option>
                  <optgroup label="0. 原有構建物選項 (v3.4 Presets)">
                    <option value="Canopy">Canopy</option>
                    <option value="Covered Walkway Shelter">Covered Walkway Shelter</option>
                    <option value="Retaining Wall">Retaining Wall</option>
                    <option value="Columns / Beams / Slabs">Columns / Beams / Slabs</option>
                    <option value="Staircase">Staircase</option>
                    <option value="Cantilevered Projecting Structure">Cantilevered Projecting Structure</option>
                    <option value="Transfer Structure">Transfer Structure</option>
                    <option value="Suspended Manhole">Suspended Manhole</option>
                    <option value="Protective Barriers / Railing Parapets">Protective Barriers / Railing Parapets</option>
                    <option value="Screen Wall / Basement Wall">Screen Wall / Basement Wall</option>
                    <option value="Hanging Structure">Hanging Structure</option>
                    <option value="Exposed Pile Cap">Exposed Pile Cap</option>
                  </optgroup>
                  <optgroup label="1. Overhead &amp; Shelter Structures">
                    <option value="Covered Walkway">Covered Walkway</option>
                    <option value="Trellis / Pergola">Trellis / Pergola</option>
                    <option value="Canopy">Canopy</option>
                    <option value="Pavilion / Gazebo">Pavilion / Gazebo</option>
                    <option value="Footbridge">Footbridge</option>
                  </optgroup>
                  <optgroup label="2. Walls, Barriers &amp; Landscaping">
                    <option value="Planter">Planter</option>
                    <option value="Parapet Wall / Railing Parapet">Parapet Wall / Railing Parapet</option>
                    <option value="Retaining Wall">Retaining Wall</option>
                    <option value="Boundary / Perimeter Wall &amp; Fencing">Boundary / Perimeter Wall &amp; Fencing</option>
                    <option value="Noise / Acoustic Barrier">Noise / Acoustic Barrier</option>
                    <option value="Screen Wall / Basement Wall">Screen Wall / Basement Wall</option>
                  </optgroup>
                  <optgroup label="3. Access &amp; Circulation">
                    <option value="External Staircase">External Staircase</option>
                    <option value="Ramp / BFA Ramp">Ramp / BFA Ramp</option>
                    <option value="Freestanding Lift Tower">Freestanding Lift Tower</option>
                    <option value="Paving / Estate Road / EVA">Paving / Estate Road / EVA</option>
                  </optgroup>
                  <optgroup label="4. Drainage &amp; Geotechnical">
                    <option value="Man-made Slope">Man-made Slope</option>
                    <option value="Surface Drainage Channel">Surface Drainage Channel</option>
                    <option value="Underground Drain / Manhole / Catchpit">Underground Drain / Manhole / Catchpit</option>
                    <option value="Suspended Manhole">Suspended Manhole</option>
                  </optgroup>
                  <optgroup label="5. Ancillary &amp; Other Structural">
                    <option value="Signage Structure / Entrance Portal">Signage Structure / Entrance Portal</option>
                    <option value="Refuse Collection Point (RCP) / Bin Bay">Refuse Collection Point (RCP) / Bin Bay</option>
                    <option value="Sports / Play Facility">Sports / Play Facility</option>
                    <option value="Street Furniture / Utility Plinth">Street Furniture / Utility Plinth</option>
                    <option value="Columns / Beams / Slabs">Columns / Beams / Slabs</option>
                    <option value="Cantilevered Projecting Structure">Cantilevered Projecting Structure</option>
                    <option value="Transfer Structure">Transfer Structure</option>
                    <option value="Hanging Structure">Hanging Structure</option>
                    <option value="Exposed Pile Cap">Exposed Pile Cap</option>
                    <option value="__CUSTOM__" id="optElemCustom">Other (Type Custom Name)...</option>
                  </optgroup>
                </select>
                <input type="text" id="fieldElemName" maxlength="160" hidden style="margin-top:8px;">
              </label>
              <label class="field">
                <span id="lblElemLoc"></span>
                <input type="text" id="fieldElemLoc" maxlength="160">
              </label>
              <label class="field">
                <span id="lblElemStatus"></span>
                <select id="fieldElemStatus">
                  <option value="normal"></option>
                  <option value="followup"></option>
                  <option value="sse"></option>
                </select>
              </label>
              <label class="field">
                <span id="lblElemWhen"></span>
                <input type="text" id="fieldElemWhen" readonly>
              </label>
            </div>

            <div class="loc-bar">
              <div><strong id="lblElemGps"></strong> <span id="elemGpsText">-</span></div>
              <div class="loc-bar-actions">
                <button type="button" id="btnRefreshGps" class="btn btn-secondary btn-sm"></button>
                <button type="button" id="btnPickMapLoc" class="btn btn-secondary btn-sm"></button>
              </div>
            </div>
          </div>

          <!-- HD Appendix X Checklist (Form A) -->
          <div class="panel" id="formAPanel">
            <div class="panel-head">
              <h2 id="secChecklistTitle"></h2>
              <div class="photo-actions">
                <button type="button" id="btnFillNa" class="btn btn-ghost btn-sm"></button>
                <button type="button" id="btnClearRatings" class="btn btn-ghost btn-sm"></button>
              </div>
            </div>
            <p class="hint" id="checklistHint"></p>
            <div class="overall-grade-bar" id="overallGradeBar">
              <div class="overall-grade-head">
                <strong id="lblOverallGrade">Overall Quick Grading</strong>
                <label class="overall-skip-toggle">
                  <input type="checkbox" id="chkSkipNa" checked>
                  <span id="lblSkipNa">Skip NA items</span>
                </label>
              </div>
              <div class="overall-grade-btns" role="group" aria-label="Apply overall rank to checklist">
                <button type="button" class="grade-quick-btn is-good" data-grade="G">G - Good</button>
                <button type="button" class="grade-quick-btn is-warn" data-grade="F">F - Fair</button>
                <button type="button" class="grade-quick-btn is-danger" data-grade="S">S - Severe</button>
                <button type="button" class="grade-quick-btn is-na" data-grade="NA">NA</button>
              </div>
            </div>
            <div id="checklistContainer"></div>
            <div id="sseAlertBanner" class="sse-alert" hidden></div>
          </div>

          <!-- Annual Inspection Form B (External Structures) -->
          <div class="panel" id="formBPanel" hidden>
            <div class="panel-head">
              <h2 id="secFormBTitle">Form B — Annual Inspection (External Structures)</h2>
              <div class="photo-actions">
                <button type="button" id="btnFormBFillNa" class="btn btn-ghost btn-sm"></button>
                <button type="button" id="btnFormBClear" class="btn btn-ghost btn-sm"></button>
              </div>
            </div>

            <div class="form-grid" style="margin-bottom:12px;">
              <label class="field field-span">
                <span id="lblFormBFloors">Floors Inspection</span>
                <div class="floor-chips" id="formBFloorChips">
                  <button type="button" class="chip" data-floor="G/F">G/F</button>
                  <button type="button" class="chip" data-floor="Podium">Podium</button>
                </div>
                <input type="text" id="fieldFormBFloors" maxlength="200" placeholder="G/F, Podium, Other Floors…">
              </label>
            </div>

            <p class="hint" id="formBHint"></p>
            <div class="overall-grade-bar" id="formBOverallBar">
              <div class="overall-grade-head">
                <strong id="lblFormBOverall">Overall Quick Appraisal</strong>
                <label class="overall-skip-toggle">
                  <input type="checkbox" id="chkFormBSkipNa" checked>
                  <span id="lblFormBSkipNa">Skip NA items</span>
                </label>
              </div>
              <div class="overall-grade-btns" role="group" aria-label="Apply overall Form B condition">
                <button type="button" class="grade-quick-btn is-good" data-grade="A">A - Good</button>
                <button type="button" class="grade-quick-btn is-warn" data-grade="B">B - Acceptable</button>
                <button type="button" class="grade-quick-btn is-danger" data-grade="C">C - Planned Maint.</button>
                <button type="button" class="grade-quick-btn is-na" data-grade="NA">NA</button>
              </div>
            </div>

            <div id="formBContainer"></div>
            <div style="margin-top:10px;">
              <button type="button" id="btnFormBAddRow" class="btn btn-secondary btn-sm"></button>
            </div>
            <div id="formBCAlertBanner" class="sse-alert" hidden></div>

            <div class="form-grid" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);">
              <label class="field">
                <span id="lblFormBInspName">Inspection Officer Name</span>
                <input type="text" id="fieldFormBInspName" maxlength="100">
              </label>
              <label class="field">
                <span id="lblFormBInspPost">Inspection Officer Post</span>
                <input type="text" id="fieldFormBInspPost" maxlength="80" placeholder="e.g. SE / TO(S)">
              </label>
              <label class="field">
                <span id="lblFormBChkName">Checking Officer Name</span>
                <input type="text" id="fieldFormBChkName" maxlength="100">
              </label>
              <label class="field">
                <span id="lblFormBChkPost">Checking Officer Post</span>
                <input type="text" id="fieldFormBChkPost" maxlength="80" placeholder="e.g. SSE / SE">
              </label>
            </div>
          </div>

          <!-- Remarks & Condition -->
          <div class="panel" id="remarksPanel">
            <div class="panel-head"><h2 id="secRemarksTitle"></h2></div>
            <div class="form-grid">
              <label class="field field-span">
                <span id="lblRemarks"></span>
                <textarea id="fieldRemarks" rows="3" maxlength="4000"></textarea>
              </label>
              <label class="field field-span">
                <span id="lblCondition"></span>
                <textarea id="fieldCondition" rows="2" maxlength="4000"></textarea>
              </label>
              <label class="field field-span">
                <span id="lblWorks"></span>
                <select id="fieldWorksSelect" style="margin-bottom:8px;">
                  <option value="" id="optWorksPlaceholder">-- 選擇 External Works 類別（自動填入下方）--</option>
                  <optgroup label="1. Overhead &amp; Shelter Structures">
                    <option value="Covered Walkway">Covered Walkway</option>
                    <option value="Trellis / Pergola">Trellis / Pergola</option>
                    <option value="Canopy">Canopy</option>
                    <option value="Pavilion / Gazebo">Pavilion / Gazebo</option>
                    <option value="Footbridge">Footbridge</option>
                  </optgroup>
                  <optgroup label="2. Walls, Barriers &amp; Landscaping">
                    <option value="Planter">Planter</option>
                    <option value="Parapet Wall / Railing Parapet">Parapet Wall / Railing Parapet</option>
                    <option value="Retaining Wall">Retaining Wall</option>
                    <option value="Boundary / Perimeter Wall &amp; Fencing">Boundary / Perimeter Wall &amp; Fencing</option>
                    <option value="Noise / Acoustic Barrier">Noise / Acoustic Barrier</option>
                  </optgroup>
                  <optgroup label="3. Access &amp; Circulation">
                    <option value="External Staircase">External Staircase</option>
                    <option value="Ramp / BFA Ramp">Ramp / BFA Ramp</option>
                    <option value="Freestanding Lift Tower">Freestanding Lift Tower</option>
                    <option value="Paving / Estate Road / EVA">Paving / Estate Road / EVA</option>
                  </optgroup>
                  <optgroup label="4. Drainage &amp; Geotechnical">
                    <option value="Man-made Slope">Man-made Slope</option>
                    <option value="Surface Drainage Channel">Surface Drainage Channel</option>
                    <option value="Underground Drain / Manhole / Catchpit">Underground Drain / Manhole / Catchpit</option>
                  </optgroup>
                  <optgroup label="5. Ancillary &amp; Community">
                    <option value="Signage Structure / Entrance Portal">Signage Structure / Entrance Portal</option>
                    <option value="Refuse Collection Point (RCP) / Bin Bay">Refuse Collection Point (RCP) / Bin Bay</option>
                    <option value="Sports / Play Facility">Sports / Play Facility</option>
                    <option value="Street Furniture / Utility Plinth">Street Furniture / Utility Plinth</option>
                  </optgroup>
                </select>
                <textarea id="fieldWorks" rows="2" maxlength="4000"></textarea>
              </label>
            </div>
          </div>

          <!-- Element Photos -->
          <div class="panel">
            <div class="photo-head">
              <h2 id="lblPhotos"></h2>
              <div class="photo-actions">
                <button type="button" id="btnTakePhoto" class="btn btn-primary btn-sm"></button>
                <button type="button" id="btnPickPhoto" class="btn btn-secondary btn-sm"></button>
              </div>
            </div>
            <input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
            <input type="file" id="fileLibrary" accept="image/*" multiple hidden>
            <p id="photoHint" class="hint"></p>
            <div id="photoGrid" class="photo-grid"></div>
          </div>

          <div class="form-actions">
            <button type="submit" id="btnSaveElem" class="btn btn-primary"></button>
            <button type="button" id="btnCancelElem" class="btn btn-ghost"></button>
            <button type="button" id="btnDeleteElem" class="btn btn-danger" hidden></button>
          </div>
        </form>
      </section>

      <!-- VIEW 4: ALBUM -->
      <section id="view-album" class="view" role="tabpanel" hidden>
        <div class="toolbar">
          <select id="albumProjectFilter" class="inline-select"></select>
        </div>
        <p id="albumEmpty" class="empty" hidden></p>
        <div id="albumGrid" class="album-grid"></div>
      </section>

      <!-- VIEW 5: MAP -->
      <section id="view-map" class="view view-map" role="tabpanel" hidden>
        <div class="map-toolbar">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <select id="mapProjectFilter" class="inline-select"></select>
            <p id="mapHint" class="hint" style="margin:0"></p>
          </div>
          <button type="button" id="btnToggleBasemap" class="btn btn-secondary btn-sm"></button>
        </div>
        <div id="mapOffline" class="map-offline" hidden></div>
        <div id="mapCanvas" class="map-canvas"></div>
      </section>

      <!-- VIEW 6: EXPORT & BACKUP -->
      <section id="view-export" class="view" role="tabpanel" hidden>
        <div class="panel">
          <h2 id="exportTitle"></h2>
          <p id="exportBlurb" class="lead"></p>
          <div class="form-grid" style="max-width:440px;margin-bottom:12px;">
            <label class="field">
              <span id="lblExportProj"></span>
              <select id="exportProjectSelect"></select>
            </label>
          </div>
          <div class="exp-presets">
            <button type="button" class="chip" id="prePdfOnly"></button>
            <button type="button" class="chip" id="preExcelOnly"></button>
            <button type="button" class="chip" id="preBackupOnly"></button>
            <button type="button" class="chip is-active" id="preBothAll"></button>
          </div>
          <div class="export-opts">
            <label class="exp-opt">
              <input type="checkbox" id="chkExpPdf" checked>
              <div><strong id="lblExpPdf"></strong><small id="descExpPdf"></small></div>
            </label>
            <label class="exp-opt">
              <input type="checkbox" id="chkExpExcel" checked>
              <div><strong id="lblExpExcel"></strong><small id="descExpExcel"></small></div>
            </label>
            <label class="exp-opt">
              <input type="checkbox" id="chkExpBackup" checked>
              <div><strong id="lblExpBackup"></strong><small id="descExpBackup"></small></div>
            </label>
          </div>
          <p id="storageInfo" class="hint"></p>
          <div class="form-actions">
            <button type="button" id="btnExportSelected" class="btn btn-primary"></button>
            <button type="button" id="btnImportBackup" class="btn btn-secondary"></button>
            <input type="file" id="fileImportBackup" accept=".json,application/json" hidden>
          </div>
          <p id="exportStatus" class="hint" aria-live="polite"></p>
        </div>
        <div class="panel">
          <h2 id="privacyTitle"></h2>
          <p id="privacyBlurb" class="lead"></p>
          <button type="button" id="btnClearAll" class="btn btn-danger"></button>
        </div>
      </section>
    </main>
  </div>

  <!-- Project Create / Edit Modal -->
  <div id="projectModal" class="modal-overlay" hidden role="dialog" aria-modal="true">
    <div class="modal-dialog">
      <h2 id="projModalTitle" style="font-size:1.08rem;margin-bottom:12px;color:var(--navy);"></h2>
      <form id="projectForm" autocomplete="off">
        <input type="hidden" id="fieldProjId">
        <div id="autofillBanner" class="autofill-note" hidden></div>
        <div class="form-grid">
          <label class="field">
            <span id="lblProjRmo"></span>
            <select id="fieldProjRmo">
              <option value="">-- 選擇 RMO 七區 / 自動帶入 --</option>
              <option value="HKI">HKI（港島及離島）</option>
              <option value="KC">KC（九龍中）</option>
              <option value="KE">KE（九龍東）</option>
              <option value="KWS">KWS（西九龍及西貢）</option>
              <option value="TY">TY（屯門及元朗）</option>
              <option value="TNS">TNS（大埔、北區及沙田）</option>
              <option value="WTT">WTT（黃大仙、青衣及荃灣）</option>
            </select>
          </label>
          <div class="field ac-wrap">
            <span id="lblProjEstate"></span>
            <input type="text" id="fieldProjEstate" required maxlength="160" placeholder="輸入中／英文屋邨名或代號搜尋…">
            <div id="estateAcList" class="ac-list" hidden></div>
          </div>
          <label class="field">
            <span id="lblProjDmo"></span>
            <input type="text" id="fieldProjDmo" maxlength="80" placeholder="選擇屋邨後自動填入">
          </label>
          <label class="field">
            <span id="lblProjHandover"></span>
            <input type="text" id="fieldProjHandover" maxlength="20" placeholder="mm/yyyy（自動填入）">
          </label>
          <label class="field">
            <span id="lblProjDate"></span>
            <input type="date" id="fieldProjDate" required>
          </label>
          <label class="field">
            <span id="lblProjNature"></span>
            <input type="text" id="fieldProjNature" maxlength="40" placeholder="PRH / HOS / TPS（自動填入）">
          </label>
          <label class="field">
            <span id="lblProjSe"></span>
            <input type="text" id="fieldProjSe" maxlength="100">
          </label>
          <label class="field">
            <span id="lblProjSse"></span>
            <input type="text" id="fieldProjSse" maxlength="100">
          </label>
          <label class="field field-span">
            <span id="lblProjNotes"></span>
            <textarea id="fieldProjNotes" rows="2" maxlength="2000"></textarea>
          </label>
        </div>
        <div class="modal-actions">
          <button type="button" id="btnProjCancel" class="btn btn-ghost btn-sm"></button>
          <button type="submit" id="btnProjSave" class="btn btn-primary btn-sm"></button>
        </div>
      </form>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" hidden>
    <button type="button" id="btnCloseLightbox" class="btn btn-ghost lightbox-close">×</button>
    <img id="lightboxImg" alt="">
    <p id="lightboxCap"></p>
  </div>

  <!-- Confirm Modal -->
  <div id="confirmModal" class="modal-overlay" hidden role="dialog" aria-modal="true">
    <div class="modal-dialog">
      <p id="confirmMsg"></p>
      <div class="modal-actions">
        <button type="button" id="btnConfirmCancel" class="btn btn-ghost btn-sm"></button>
        <button type="button" id="btnConfirmOk" class="btn btn-danger btn-sm"></button>
      </div>
    </div>
  </div>

  <!-- Map Location Picker Modal -->
  <div id="pickerModal" class="modal-overlay" hidden role="dialog" aria-modal="true">
    <div class="modal-dialog modal-dialog-wide">
      <h2 id="pickerTitle" style="font-size:1.05rem;margin-bottom:4px;"></h2>
      <p id="pickerHint" class="hint" style="margin:0 0 8px;"></p>
      <div id="pickerMap"></div>
      <div class="modal-actions">
        <button type="button" id="btnPickerCancel" class="btn btn-ghost btn-sm"></button>
        <button type="button" id="btnPickerApply" class="btn btn-primary btn-sm"></button>
      </div>
    </div>
  </div>

  <!-- Printable Report Modal (Full Estate Report OR Single Element Appendix X) -->
  <div id="reportModal" class="modal-overlay" hidden role="dialog" aria-modal="true">
    <div class="modal-dialog modal-dialog-wide">
      <div class="panel-head no-print">
        <h2 id="reportModalTitle"></h2>
        <button type="button" id="btnCloseReport" class="btn btn-ghost btn-sm">×</button>
      </div>
      <div id="reportSheet" class="report-sheet"></div>
      <div class="modal-actions no-print">
        <button type="button" id="btnReportDownloadPdf" class="btn btn-primary btn-sm"></button>
        <button type="button" id="btnReportPrintNow" class="btn btn-secondary btn-sm"></button>
        <button type="button" id="btnReportClose2" class="btn btn-ghost btn-sm"></button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
  <noscript><p style="padding:1.5rem;font-family:sans-serif">This app needs JavaScript. 呢個 App 需要啟用 JavaScript。</p></noscript>

  <script src="./vendor/jszip.min.js"></script>
  <script src="./vendor/leaflet/leaflet.js"></script>
  <script src="./estates-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
